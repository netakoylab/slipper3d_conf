[gcode_macro _RUNOUT_INFO]
gcode:
  {% if 'filament_motion_sensor runout' in printer.configfile.settings %}
    #{% set enable = printer['filament_motion_sensor btt_sensor'].enabled %}
    #{% set detect = printer['filament_motion_sensor btt_sensor'].filament_detected %}
    {% set enable = true %}
    {% set detect = true %}
    {action_respond_info("RUNOUT Motion Sensor:
                          Enabled: %s
                          Detect Filament: %s" % (enable|lower,detect|lower))}
  {% endif %}
  
[gcode_macro print_start]
gcode:
    {% set head_temp = params.H_TEMP|default(220)|float %}
    {% set bed_temp = params.B_TEMP|default(60)|float %}
    M117 Homing...
    STATUS_HOMING
    G28
    M107
    M117 Calibrating...
    STATUS_CALIBRATING_Z
    M140 S{bed_temp}
    M190 S{bed_temp}
    Z_TILT_ADJUST
    G28 Z
    BED_MESH_CALIBRATE
    G90
    G0 X60 Y350
    M117 Heating...  
    STATUS_HEATING
    M104 S200
    M109 S200
    M117 Brushing...
    STATUS_CLEANING
    G0 Z2.5
    G0 X120 F6000
    G0 X60 F6000
    M104 S{head_temp}
    M109 S{head_temp}
    G0 X120 F6000
    G0 X60 F6000
    G0 Z10
    M117 Purging...
    STATUS_CLEANING
    VORON_PURGE
    M117 Printing...
    STATUS_PRINTING
   

[gcode_macro print_end]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 50, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-1.0 F1600                 ; retract filament
    TURN_OFF_HEATERS
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    M84
    M117 Finished!
    STATUS_OFF


