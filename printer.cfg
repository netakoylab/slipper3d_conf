[include mainsail.cfg]
[include KAMP_Settings.cfg]
[include display.cfg]
[include macros.cfg]
[include leds.cfg]

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True ; use custom park coordinates for x,y [True/False]
variable_custom_park_x    : 5.0   ; custom x position; value must be within your defined min and max of X
variable_custom_park_y    : 5.0   ; custom y position; value must be within your defined min and max of Y
variable_custom_park_dz   : 50.0   ; custom dz value; the value in mm to lift the nozzle when move to park position
#variable_retract          : 1.0   ; the value to retract while PAUSE
#variable_cancel_retract   : 5.0   ; the value to retract while CANCEL_PRINT
#variable_speed_retract    : 35.0  ; retract speed in mm/s
#variable_unretract        : 1.0   ; the value to unretract while RESUME
#variable_speed_unretract  : 35.0  ; unretract speed in mm/s
variable_speed_hop        : 15.0  ; z move speed in mm/s
variable_speed_move       : 100.0 ; move speed in mm/s
variable_park_at_cancel   : True ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
variable_park_at_cancel_x : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_park_at_cancel_y : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
## !!! Caution [firmware_retraction] must be defined in the printer.cfg if you set use_fw_retract: True !!!
variable_use_fw_retract   : True ; use fw_retraction instead of the manual version [True/False]
variable_idle_timeout     : 0     ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
variable_runout_sensor    : "filament_motion_sensor btt_sensor"    ; If a sensor is defined, it will be used to cancel the execution of RESUME in case no filament is detected.
##                                   Specify the config name of the runout sensor e.g "filament_switch_sensor runout". Hint use the same as in your printer.cfg
## !!! Custom macros, please use with care and review the section of the corresponding macro.
## These macros are for simple operations like setting a status LED. Please make sure your macro does not interfere with the basic macro functions.
## Only  single line commands are supported, please create a macro if you need more than one command.
variable_user_pause_macro : "STATUS_BUSY"    ; Everything inside the "" will be executed after the klipper base pause (PAUSE_BASE) function
variable_user_resume_macro: "STATUS_PRINTING"    ; Everything inside the "" will be executed before the klipper base resume (RESUME_BASE) function
variable_user_cancel_macro: "STATUS_OFF"    ; Everything inside the "" will be executed before the klipper base cancel (CANCEL_PRINT_BASE) function
gcode:


[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_39004700095053424E363420-if00
restart_method: command

[mcu EBBCan]
canbus_uuid: 5d351be581be

[temperature_sensor raspberry]
sensor_type: temperature_host

[temperature_sensor octopus]
sensor_type: temperature_mcu

[temperature_sensor EBB_NTC]
sensor_type: Generic 3950
sensor_pin: EBBCan:gpio28

[idle_timeout]
timeout: 1800

[printer]
# Voron Trident by NetakoyLab (Sniji) 26\06\26
kinematics: corexy
max_velocity: 300
max_accel: 6000
max_z_velocity: 25
max_z_accel: 150
square_corner_velocity: 5.0

[stepper_x]
# A Stepper - Left
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200
endstop_pin: EBBCan:gpio24
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 60
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 1.2

[stepper_y]
# B Stepper - Right
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200
endstop_pin: PG9
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 1.2

[input_shaper]
shaper_freq_x: 64.8
shaper_type_x: mzv
shaper_freq_y: 46.6
shaper_type_y: mzv

[adxl345]
cs_pin: EBBCan:gpio1
spi_software_sclk_pin: EBBCan:gpio2
spi_software_mosi_pin: EBBCan:gpio0
spi_software_miso_pin: EBBCan:gpio3
axes_map: z,-y,x

[resonance_tester]
probe_points: 175, 175, 50
accel_chip: adxl345

[stepper_z]
# Z0 Stepper - Front Left

##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##  Increasing position_endstop brings nozzle closer to the bed
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 8    
microsteps: 32
endstop_pin: PG10
#position_endstop: -0.5
position_max: 250
position_min: -1
homing_speed: 8.0
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.6
stealthchop_threshold: 999999

[stepper_z1]
# Z1 Stepper - Rear Center
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
rotation_distance: 8  
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
run_current: 0.6
stealthchop_threshold: 999999

[stepper_z2]
# Z2 Stepper - Front Right
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 8  
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
run_current: 0.6
stealthchop_threshold: 999999

[probe]
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##  Increasing position_endstop brings nozzle closer to the bed
pin: ^EBBCan:gpio6
x_offset: 0
y_offset: 25.0
#z_offset: 5.3
speed: 10.0
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.006
samples_tolerance_retries: 3

[safe_z_home]
# Position of mechanical Z-endstop
home_xy_position:194.4,350
speed:60
z_hop:10

[z_tilt]
# Y-offset is 25mm for inductive probe ( so make -25mm from nozzle-like coords)
z_positions:
   -50, 18
   175, 398
   400, 18
points:
   30, 5
   175, 295
   320, 5
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075

[bed_mesh]
speed: 100
horizontal_move_z: 10
mesh_min: 15, 30
mesh_max: 335, 320
probe_count: 5, 5

[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 1.0
min_temp: 0
max_temp: 120

[extruder]
step_pin: EBBCan:gpio18
dir_pin: !EBBCan:gpio19
enable_pin: !EBBCan:gpio17
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 22.6789511
nozzle_diameter: 0.400
gear_ratio: 50:10
filament_diameter: 1.750
max_extrude_cross_section: 5
heater_pin: EBBCan:gpio7
sensor_type: MAX31865
sensor_pin: EBBCan:gpio9
spi_software_sclk_pin: EBBCan:gpio10
spi_software_mosi_pin: EBBCan:gpio8
spi_software_miso_pin: EBBCan:gpio11
rtd_nominal_r: 100
rtd_reference_r: 430
rtd_num_of_wires: 2
control: pid
pid_Kp: 21.564
pid_Ki: 1.775
pid_Kd: 65.498
min_temp: 10
max_temp: 360
max_power: 1.0
min_extrude_temp: 180
pressure_advance: 0.03
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: EBBCan:gpio20
run_current: 0.6

[firmware_retraction]
retract_length: 0.8
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
retract_speed: 40
#   The speed of retraction, in mm/s. The default is 20 mm/s.
#unretract_extra_length: 0
#   The length (in mm) of *additional* filament to add when
#   unretracting.
#unretract_speed: 10
#   The speed of unretraction, in mm/s. The default is 10 mm/s.

[filament_motion_sensor btt_sensor]
detection_length: 7.0
extruder: extruder
switch_pin: PG11
pause_on_runout: True
#   When set to True, a PAUSE will execute immediately after a runout
#   is detected. Note that if pause_on_runout is False and the
#   runout_gcode is omitted then runout detection is disabled. Default
#   is True.
runout_gcode:
#    M117 Filament out
#   A list of G-Code commands to execute after a filament runout is
#   detected. See docs/Command_Templates.md for G-Code format. If
#   pause_on_runout is set to True this G-Code will run after the
#   PAUSE is complete. The default is not to run any G-Code commands.
insert_gcode:
#   A list of G-Code commands to execute after a filament insert is
#   detected. See docs/Command_Templates.md for G-Code format. The
#   default is not to run any G-Code commands, which disables insert
#   detection.
event_delay: 3.0
#   The minimum amount of time in seconds to delay between events.
#   Events triggered during this time period will be silently
#   ignored. The default is 3 seconds.
pause_delay: 0.5
#   The amount of time to delay, in seconds, between the pause command
#   dispatch and execution of the runout_gcode. It may be useful to
#   increase this delay if OctoPrint exhibits strange pause behavior.
#   Default is 0.5 seconds.

[fan]
# FAN0 - Model cooling fan
pin: EBBCan:gpio13

[heater_fan hotend_fan]
# FAN1 - Radiator cooling fan
pin: EBBCan:gpio14
heater: extruder
heater_temp: 50.0

[controller_fan controller_fan]
# FAN2 - Controller fan
pin: PD12
kick_start_time: 0.5
heater: heater_bed

[controller_fan controller_fan2]
# FAN3 - Controller fan
pin: PD13
kick_start_time: 0.5
heater: heater_bed

[heater_fan exhaust_fan]
# FAN4 - Exhaust fan
pin: PD14
max_power: 0.8
shutdown_speed: 0.0
kick_start_time: 1.0
heater: heater_bed
heater_temp: 60
fan_speed: 1.0

[heater_fan nevermore]
# FAN5 - Exhaust fan 
pin: PD15
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 1.0
heater: extruder
heater_temp: 100
fan_speed: 0.5

[exclude_object]

